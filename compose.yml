x-build: &build
  context: .
  dockerfile: Dockerfile

x-data-volumes: &data-volumes
  - "${PHANTOMBOT_DATA_PATH:-phantombot-data}:/app/data"

x-baseline-request-path: &baseline-request-path "/app/data/steam-baseline-request.json"

services:
  phantom-bot:
    image: phantom-bot:local
    build: *build
    restart: unless-stopped

    environment:
      Discord__Token: "${DISCORD_TOKEN:?Set DISCORD_TOKEN}"
      PhantomBot__NewAppDiscordChannelId: "${NEW_APP_DISCORD_CHANNEL_ID:?Set NEW_APP_DISCORD_CHANNEL_ID}"
      PhantomBot__RemovedAppsDiscordChannelId: "${REMOVED_APPS_DISCORD_CHANNEL_ID:?Set REMOVED_APPS_DISCORD_CHANNEL_ID}"
      PhantomBot__ReviewDiscordChannelId: "${REVIEW_DISCORD_CHANNEL_ID:?Set REVIEW_DISCORD_CHANNEL_ID}"
      PhantomBot__ReviewManagerRoleId: "${REVIEW_MANAGER_ROLE_ID:?Set REVIEW_MANAGER_ROLE_ID}"
      PhantomBot__DatabasePath: /app/data/phantombot.db
      PhantomBot__BaselineRequestPath: *baseline-request-path
      PhantomBot__BaselinePath: /app/data/steam-app-baseline.json

    volumes: *data-volumes

  baseline:
    image: phantom-bot:local
    build: *build

    profiles:
      - tools

    entrypoint:
      - dotnet
      - /app/baseline/PhantomBot.Baseline.dll

    command:
      - --request
      - *baseline-request-path

    volumes: *data-volumes

volumes:
  phantombot-data: